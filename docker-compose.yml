services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems"]
      interval: 5s
      timeout: 3s
      retries: 20

  influxdb:
    image: influxdb:2.7-alpine
    container_name: ems-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: ems
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      # 与后端 application.yml 中 ems.influx.token 保持一致
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ems-dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2

  emqx:
    image: emqx/emqx:5.8
    container_name: ems-emqx
    environment:
      EMQX_NAME: ems
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # MQTT over WS
      - "18083:18083"   # Dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  influxdata:
